            <div class="teaser-answer">
              <p>
                <span class="teaser-filler">Interpolation and approximation are two of the most important topics in
                numerical analysis and are used everywhere in engineering. First, the problem.</span>
                <span class="teaser-piece" tabindex="0" data-sp="1" data-label="correct"
                  data-why="Agreement with the data at every node is the interpolation condition."
                  >Interpolation constructs a function that agrees with the data at every node
                  x<sub>0</sub>,&nbsp;…,&nbsp;x<sub>n</sub>.</span>
                <span class="teaser-piece" tabindex="0" data-sp="2" data-label="correct" data-initial="unclear"
                  data-why-initial="&quot;May or may not go through&quot; captures that passing through is not required, but &quot;a model of the data&quot; leaves out the closeness criterion (minimising an error). Borderline; the instructor should decide."
                  data-why="On review the core distinction is present: the curve is not required to pass through the points, and &quot;a model of the data&quot; is a fit to the data as a whole. Enough for the one-mark point."
                  >Approximation is more like a model of the data, which may or may not go through them depending on the
                  method.</span>
              </p>
              <p>
                <span class="teaser-filler">Second, the methods.</span>
                <span class="teaser-piece" tabindex="0" data-sp="3" data-label="correct"
                  data-why="Lists the polynomial and spline interpolation methods named in the key."
                  >Typical interpolation methods are Lagrange interpolation, Newton’s divided differences and cubic
                  splines.</span>
                <span class="teaser-piece" tabindex="0" data-sp="4" data-label="wrong"
                  data-why="Minimising the largest deviation is minimax (Chebyshev, L∞) approximation, not least squares, which minimises the sum of squared residuals. &quot;Best in every sense&quot; is also false, since each norm gives a different best fit. The method is named, but its definition is wrong."
                  >For approximation, least squares chooses the coefficients that minimise the largest absolute deviation
                  max|f(x<sub>i</sub>)&nbsp;−&nbsp;y<sub>i</sub>|, which makes it the best approximation in every
                  sense.</span>
              </p>
              <p>
                <span class="teaser-filler">Third, advantages and disadvantages.</span>
                <span class="teaser-piece" tabindex="0" data-sp="5" data-label="correct"
                  data-why="Exactness at the data and the precise-data use case match the interpolation advantage."
                  >Interpolation is exact at the data, so for precise tabulated values it is the natural choice.</span>
                <span class="teaser-piece" tabindex="0" data-sp="6" data-label="correct"
                  data-why="Robustness to random error, smoothness and following the trend cover the approximation advantage."
                  >Approximation is less affected by random errors and gives a smoother curve that follows the
                  trend.</span>
                <span class="teaser-filler">Both methods are widely used in practice.</span>
                <span class="teaser-piece" tabindex="0" data-sp="7" data-label="wrong"
                  data-why="Names the Runge phenomenon correctly, then reverses the key fact: adding more equally spaced nodes makes the oscillation worse. The remedy is Chebyshev nodes or piecewise (spline) interpolation. The buried claim is wrong, so no credit."
                  >The main weakness of interpolation is the Runge phenomenon, which can always be removed by adding more
                  equally spaced nodes.</span>
                <span class="teaser-piece" tabindex="0" data-sp="8" data-label="correct"
                  data-why="Non-zero residuals and the overfitting risk of a poorly chosen degree match the approximation disadvantage."
                  >The weakness of approximation is that the fitted curve does not reproduce the measured values, and
                  choosing too high a degree leads to overfitting.</span>
              </p>

                <span class="teaser-sp-title">Problem Distinction: Approximation</span>
                <span class="teaser-sp-text">Given a set of discrete points, find a curve or function that is as close as possible to but not necessarily passing through all points, often used in noisy data situations.</span>
                <span class="teaser-sp-tag" aria-hidden="true"></span>

              <li class="teaser-sp" data-sp="3" data-label="correct">

                <span class="teaser-sp-tag" aria-hidden="true"></span>
              </li>

              <li class="teaser-sp" data-sp="5" data-label="correct">
                <span class="teaser-sp-num" aria-hidden="true">5</span>
                <span class="teaser-sp-title">Advantage: Interpolation</span>
                <span class="teaser-sp-text">Passes through all data points accurately, suitable for precise data modeling without noise.</span>
                <span class="teaser-sp-tag" aria-hidden="true"></span>
              </li>
              <li class="teaser-sp" data-sp="6" data-label="correct">
                <span class="teaser-sp-num" aria-hidden="true">6</span>
                <span class="teaser-sp-title">Advantage: Approximation</span>
                <span class="teaser-sp-text">Robust to noise and outliers; captures the overall trend with a simple, smooth model and generalizes better between data points.</span>
                <span class="teaser-sp-tag" aria-hidden="true"></span>
              </li>
              <li class="teaser-sp" data-sp="7" data-label="wrong">
                <span class="teaser-sp-num" aria-hidden="true">7</span>
                <span class="teaser-sp-title">Disadvantage: Interpolation</span>
                <span class="teaser-sp-text">Sensitive to noise; high-degree polynomial interpolation on equally spaced nodes can oscillate strongly near the interval ends (Runge phenomenon).</span>
                <span class="teaser-sp-tag" aria-hidden="true"></span>
              </li>
              <li class="teaser-sp" data-sp="8" data-label="correct">

                <span class="teaser-sp-tag" aria-hidden="true"></span>
